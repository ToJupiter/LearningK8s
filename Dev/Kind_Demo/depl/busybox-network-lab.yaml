apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: busybox-network-lab
  namespace: default
spec:
  selector:
    matchLabels:
      app: busybox-network-lab
  template:
    metadata:
      labels:
        app: busybox-network-lab
    spec:
      hostNetwork: false

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
        - name: busybox
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep 86400"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
