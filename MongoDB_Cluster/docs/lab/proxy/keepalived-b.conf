# Keepalived for Proxy B (priority 110 -> standby VIP owner).
# Identical to keepalived-a.conf except: router_id, priority and the
# unicast source/peer pair. Everything else MUST stay identical, otherwise
# the two nodes will not agree on the VRRP instance.

global_defs {
    router_id LAB_PROXY_B
    enable_script_security
    script_user root
}

vrrp_script chk_haproxy {
    script "/usr/local/bin/check-haproxy.sh"
    interval 2
    timeout 2
    fall 2
    rise 2
    weight -30        # 110-30 = 80: if BOTH haproxies die, nobody keeps the VIP
    user root
}

vrrp_instance VI_MONGO {
    state BACKUP
    interface eth0
    virtual_router_id 77
    priority 110              # standby: only wins when A is demoted/dead
    advert_int 1

    preempt_delay 5

    unicast_src_ip 172.30.77.32
    unicast_peer {
        172.30.77.31
    }

    virtual_ipaddress {
        172.30.77.100/24 dev eth0
    }

    garp_master_delay 1
    garp_master_repeat 3
    garp_master_refresh 5

    track_script {
        chk_haproxy
    }
}
